version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [next, react, react-dom, eslint-config-next]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
