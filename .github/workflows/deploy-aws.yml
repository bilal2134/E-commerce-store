name: Deploy to AWS

# Builds the OpenNext bundle and deploys the UsbaApp stack (ADR 0014,
# docs/deployment/aws.md). Does nothing until the repository variable
# AWS_DEPLOY_ROLE_ARN (OIDC role from the UsbaCi stack) or AWS_DEPLOY_WITH_KEYS
# = "true" (deploy user's access key in secrets, for AWS project accounts) is
# set, so pushing this file never deploys by itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS role (when AWS_DEPLOY_ROLE_ARN is used)

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' || vars.AWS_DEPLOY_WITH_KEYS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      AWS_REGION: ap-southeast-2
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time environment: pages are prerendered from the production
      # database, read as DSQL admin with a short-lived IAM token.
      NODE_ENV: production
      SITE_URL: ${{ vars.SITE_URL }}
      DATABASE_URL: postgres://admin@${{ vars.DSQL_ENDPOINT }}:5432/postgres
      DATABASE_AUTH: dsql-iam
      DATABASE_SSL: verify-full
      DATABASE_POOL_MAX: "2"
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_REGION: ap-southeast-2
      S3_KEY_PREFIX: media/
      MEDIA_BASE_URL: ${{ vars.SITE_URL }}/media
      ANALYTICS_SALT: ${{ secrets.ANALYTICS_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: AWS login (OIDC role)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: AWS login (deploy user)
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Migrate database (Aurora DSQL)
        run: pnpm db:migrate:dsql

      - name: Build (OpenNext for Lambda)
        run: mkdir -p public && pnpm exec open-next build

      - name: Package for CDK
        run: bash scripts/aws/package-opennext.sh dist/aws

      - name: Deploy UsbaApp
        working-directory: infrastructure/aws/cdk
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          USBA_DOMAIN: ${{ vars.USBA_DOMAIN }}
          USBA_CERTIFICATE_ARN: ${{ vars.USBA_CERTIFICATE_ARN }}
          USBA_SITE_URL: ${{ vars.SITE_URL }}
          USBA_ALERT_EMAIL: ${{ vars.USBA_ALERT_EMAIL }}
          ORIGIN_VERIFY_SECRET: ${{ secrets.ORIGIN_VERIFY_SECRET }}
          ANALYTICS_SALT: ${{ secrets.ANALYTICS_SALT }}
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          npx cdk deploy UsbaApp --require-approval never --exclusively
